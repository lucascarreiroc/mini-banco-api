services:
  postgres:
    image: postgres:16
    container_name: minibanco-db
    environment:
      POSTGRES_DB: minibanco
      POSTGRES_USER: minibanco
      POSTGRES_PASSWORD: minibanco
    ports:
      - "5433:5432"
    volumes:
      - minibanco-data:/var/lib/postgresql/data

volumes:
  minibanco-data:
