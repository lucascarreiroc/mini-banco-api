spring:
  application:
    name: mini-banco
  datasource:
    url: jdbc:postgresql://localhost:5433/minibanco
    username: minibanco
    password: minibanco
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    hibernate:
      ddl-auto: validate   # quem cria/altera tabelas é o Flyway
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
jwt:
  secret: ${JWT_SECRET:dev-secret-mini-banco-trocar-em-producao-0123456789abcdef}
  expiracao-minutos: 60
banco:
  limites:
    diario: 5000.00
