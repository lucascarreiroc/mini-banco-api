spring:
  application:
    name: mini-banco
  datasource:
    url: jdbc:postgresql://localhost:5433/minibanco
    username: minibanco
    password: minibanco
  jpa:
    hibernate:
      ddl-auto: validate   # quem cria/altera tabelas é o Flyway
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
